<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>jev-router</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #070707;
        color: #f4f1ea;
        font-family: "IBM Plex Sans", "Helvetica Neue", sans-serif;
      }
      .card {
        width: 1080px;
        height: 1080px;
        box-sizing: border-box;
        padding: 120px 100px 88px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: #070707;
      }
      h1 {
        margin: 0;
        font-size: 88px;
        line-height: 1.02;
        letter-spacing: -0.04em;
        font-weight: 700;
      }
      .sub {
        margin-top: 28px;
        font-size: 28px;
        color: #9a9488;
        letter-spacing: 0.01em;
      }
      .flow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 40px;
      }
      .reqs,
      .out {
        font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
        font-size: 20px;
        line-height: 2;
      }
      .reqs {
        color: #f0b429;
      }
      .out .dim {
        color: #6f6a62;
      }
      .jev {
        flex: 0 0 auto;
        width: 96px;
        height: 64px;
        border: 1.5px solid #f0b429;
        border-radius: 12px;
        display: grid;
        place-items: center;
        color: #f0b429;
        font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
        font-size: 24px;
        letter-spacing: 0.06em;
      }
      .foot {
        font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
        font-size: 20px;
        color: #6f6a62;
      }
      .foot span {
        color: #f0b429;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <header>
        <h1>No Routes.<br />Only Jev.</h1>
        <div class="sub">The world's first 0-route API</div>
      </header>
      <div class="flow">
        <div class="reqs">
          GET /please-list-the-people<br />
          GET /users<br />
          POST / {"email":"a@b.c"}
        </div>
        <div class="jev">Jev</div>
        <div class="out">
          <span class="dim">//</span> listUsers()<br />
          <span class="dim">//</span> createUser()
        </div>
      </div>
      <div class="foot">jev-router &nbsp;·&nbsp; $ <span>npm i jevexpress</span></div>
    </div>
  </body>
</html>
